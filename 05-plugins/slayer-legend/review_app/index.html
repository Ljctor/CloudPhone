<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Simulation · Slayer Legend</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="stage" aria-label="Copie inerte du téléphone">
    <div id="phone" class="phone" aria-label="Capture interactive, sans action sur le jeu">
      <img id="screen-image" alt="Capture enregistrée" draggable="false">
      <svg id="overlay" viewBox="0 0 480 1040" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div id="effects" aria-hidden="true"></div>
      <div id="notice" class="notice" role="status" hidden></div>
    </div>
  </main>
  <nav id="toolbar" class="toolbar" aria-label="Téléphone simulé">
    <button id="toolbar-grip" class="control grip" aria-label="Déplacer la barre">⠿</button>
    <button id="back" class="control" aria-label="Capture précédente" title="Retour">◁</button>
    <button id="home" class="control" aria-label="Retour à la capture Combat" title="Combat">○</button>
    <button id="reload" class="control" aria-label="Actualiser les captures" title="Actualiser les captures">↻</button>
    <button id="fullscreen" class="control" aria-label="Plein écran" title="Plein écran">⛶</button>
    <button id="options-open" class="control" aria-label="Options" title="Options">⚙</button>
  </nav>
  <aside id="options-panel" class="feedback-panel" aria-label="Options de simulation" hidden>
    <div class="panel-heading"><strong>Simulation</strong><button id="options-close" class="control" aria-label="Fermer les options">×</button></div>
    <p>Captures enregistrées · aucun contrôle du jeu.</p>
    <label class="overlay-control"><input id="overlay-toggle" type="checkbox" checked><span>Zones de navigation et d’action</span></label>
    <label class="overlay-control"><input id="landmarks-toggle" type="checkbox" checked><span>Repères du plugin</span></label>
    <fieldset><legend>Barre de boutons</legend>
      <label><input type="radio" name="toolbar-position" value="right" checked>À droite</label>
      <label><input type="radio" name="toolbar-position" value="bottom">En bas</label>
      <label><input type="radio" name="toolbar-position" value="floating">Flottante</label>
    </fieldset>
    <button id="feedback-open">Signaler une correction · texte ou voix</button>
  </aside>
  <aside id="feedback-panel" class="feedback-panel" aria-label="Votre correction" hidden>
    <div class="panel-heading"><strong>Votre correction</strong><button id="feedback-close" class="control" aria-label="Fermer la correction">×</button></div>
    <p>Appui long sur une zone : proposer sa suppression.</p>
    <label for="annotation-kind">Ajouter une zone</label>
    <select id="annotation-kind"><option value="">Parcourir</option><option value="navigation">Navigation</option><option value="action">Action</option><option value="forbidden">Interdit</option><option value="detection">Reconnaissance</option><option value="vertical">Slide vertical</option><option value="horizontal">Slide horizontal</option><option value="draggable">Glisser-déposer</option></select>
    <form id="feedback-form">
      <label for="correct-screen">Nom réel de l’écran · facultatif</label><input id="correct-screen" type="text" maxlength="120">
      <label for="feedback-text">Ce qui ne correspond pas</label><textarea id="feedback-text" rows="3" maxlength="4000" required></textarea>
      <button type="submit">Enregistrer le retour</button><p id="feedback-result" role="status"></p>
    </form>
  </aside>
</body>
</html>
