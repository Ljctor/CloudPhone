[package]
name = "cloudphone-e2e"
version = "0.1.0"
edition = "2021"
publish = false
description = "Black-box end-to-end tests of Cloud Phone, on a fake emulator or a deployed instance"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
tungstenite = "0.24"
url = "2"
fantoccini = { version = "0.22", default-features = false }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
futures-util = "0.3"
libc = "0.2"

[features]
# Tests against a deployed instance at CLOUDPHONE_URL: tests/smoke.rs, and
# tests/contract.rs pointed at that instance instead of the fake.
smoke = []

[[test]]
name = "smoke"
required-features = ["smoke"]
