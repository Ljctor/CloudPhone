# Cloud Phone configuration, read by the systemd units through EnvironmentFile.
# Plain KEY=VALUE lines only: no quotes, no shell expansion.
# Restart the services after editing:
#   systemctl restart cloudphone-emulator.service

# Address the web UI (WEB_PORT) and the gateway (port 8001) listen on.
# 0.0.0.0 listens everywhere and relies on the firewall to stay private.
# Prefer the WireGuard address of this host, e.g. 10.20.0.1 (docs/WIREGUARD.md).
LISTEN_ADDRESS=0.0.0.0
WEB_PORT=8000

# Android Virtual Device. The AVD lives in /var/lib/cloudphone/avd/.
AVD_NAME=cloudphone
EMULATOR_MEMORY_MB=4096
EMULATOR_CORES=4
EMULATOR_GPU=swiftshader_indirect

# Console port: adb sees the device as emulator-<EMULATOR_PORT>.
# Both ports are bound to loopback by the emulator.
EMULATOR_PORT=5558
GRPC_PORT=8554

# Screen of a newly created AVD. Changing these later does not alter an
# existing AVD.
SCREEN_WIDTH=540
SCREEN_HEIGHT=1170
SCREEN_DENSITY=240
