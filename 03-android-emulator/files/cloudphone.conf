# Cloud Phone configuration, read by the systemd units through EnvironmentFile.
# Plain KEY=VALUE lines only: no quotes, no shell expansion.
# Restart the services after editing:
#   systemctl restart cloudphone-emulator.service

# Address the web page and its gateway (one port, WEB_PORT) listen on.
# 0.0.0.0 listens everywhere and relies on the firewall to stay private.
# Prefer the WireGuard address of this host, e.g. 10.20.0.1 (02-wireguard-server).
LISTEN_ADDRESS=0.0.0.0
WEB_PORT=8000

# Android Virtual Device. The AVD lives in /var/lib/cloudphone/avd/.
AVD_NAME=cloudphone
EMULATOR_MEMORY_MB=4096
EMULATOR_CORES=4
EMULATOR_GPU=swiftshader

# Console port: adb sees the device as emulator-<EMULATOR_PORT>; the emulator
# also uses EMULATOR_PORT + 1. Both are bound to loopback by the emulator.
EMULATOR_PORT=5558
GRPC_PORT=8554

# adb server used by this instance. Use a dedicated port when another Android
# emulator or adb user already runs on the host (default 5037).
ANDROID_ADB_SERVER_PORT=5037

# Screen of a newly created AVD. Changing these later does not alter an
# existing AVD.
SCREEN_WIDTH=480
SCREEN_HEIGHT=1040
SCREEN_DENSITY=213
